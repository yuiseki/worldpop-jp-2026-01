[project]
name = "worldpop-jp-2026-01"
version = "0.1.0"
description = "WorldPop R2025A rasters for Japan, 2015 to 2030, as published and as COG"
requires-python = ">=3.12"
dependencies = [
    # Versions before 1.5.5 have bugs in the spatial extension.
    "duckdb>=1.5.5",
    "huggingface-hub>=0.35",
    "rasterio>=1.5.1",
    "numpy>=2.5",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.9"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
